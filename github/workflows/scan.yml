#!/usr/bin/env python3
"""
Scan PumpSwap tokens early stage → Alert Telegram
Déployé sur GitHub Actions — cron toutes les heures
"""
import json, re, urllib.request, urllib.parse
from datetime import datetime

# === CONFIG ===
TOKEN = "8786319984:AAGG4tNo980iCK6JZn_0Jp05STBwjSWnj8k"
CHAT_ID = "2108458021"
TG = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
LAST_FILE = "last_seen.json"


def send(msg):
    try:
        data = f"chat_id={CHAT_ID}&parse_mode=Markdown&text={urllib.parse.quote(msg)}".encode()
        req = urllib.request.Request(TG, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"})
        with urllib.request.urlopen(req, timeout=10) as r:
            json.loads(r.read())
        return True
    except:
        return False


def fetch_tokens():
    pairs = []
    try:
        url = "https://api.dexscreener.com/latest/dex/search?q=pumpswap&limit=50"
        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, timeout=15) as r:
            for p in json.loads(r.read()).get("pairs", []):
                if p.get("chainId") == "solana":
                    addr = p.get("baseToken", {}).get("address", "")
                    if addr and "pump" in addr.lower():
                        pairs.append(p)
    except:
        pass
    seen = set()
    out = []
    for p in pairs:
        addr = p.get("baseToken", {}).get("address", "")
        if addr and addr not in seen:
            seen.add(addr)
            out.append(p)
    return out[:40]


def load_seen():
    try:
        with open(LAST_FILE) as f:
            return json.load(f)
    except:
        return []


def save_seen(seen):
    with open(LAST_FILE, "w") as f:
        json.dump(seen, f)


def main():
    seen = set(load_seen())
    pairs = fetch_tokens()
    found = []

    for pair in pairs:
        base = pair.get("baseToken", {})
        symbol = base.get("symbol", "?")
        name = base.get("name", "?")
        addr = base.get("address", "")

        if addr in seen:
            continue

        mc = pair.get("marketCap", 0)
        vol = pair.get("volume", {}).get("h24", 0)
        liq = pair.get("liquidity", {}).get("usd", 0)
        pc = pair.get("priceChange", {}).get("h1", 0)

        # Early stage filter
        if not (5000 < mc < 300000 and vol > 5000 and liq > 5000):
            continue
        if abs(pc) > 1000:
            continue

        score = sum([
            1 if 50000 < mc < 200000 else 0,
            1 if vol > 100000 else 0,
            1 if liq > 30000 else 0,
            1 if abs(pc) < 300 else 0,
            1 if mc > 100000 else 0,
        ])

        if score >= 3:
            msg = f"🔍 *{name}* ({symbol})\n\n"
            msg += f"🆔 `{addr[:20]}...{addr[-10:]}`\n"
            msg += f"💰 MC: ${mc:,.0f} | Vol: ${vol:,.0f} | LP: ${liq:,.0f}\n"
            msg += f"📈 1h: {pc}%\n\n"
            msg += f"🛡️ Score: {score}/5\n\n"
            msg += f"🔗 https://gmgn.ai/sol/token/{addr}"
            if send(msg):
                found.append(addr)
                print(f"  ⚡ {name} MC${mc:,.0f}")

    seen.update(found)
    save_seen(list(seen))
    print(f"  Total: {len(found)} alerte(s) envoyée(s)")


if __name__ == "__main__":
    main()
